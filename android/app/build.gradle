plugins {
    id 'com.android.application'
}
android {
    namespace 'io.github.flinttgaverdale.cinematico'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.flinttgaverdale.cinematico'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('cinematicoVersionCode').map { it.toInteger() }.getOrElse(1)
        versionName providers.gradleProperty('cinematicoVersionName').getOrElse('0.1.0-beta')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
