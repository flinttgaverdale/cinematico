<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piloto de escucha de Cinemático</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}
body{max-width:44rem;margin:2rem auto;padding:0 1rem;line-height:1.5}
fieldset{margin:1rem 0;padding:1rem;border:1px solid gray;border-radius:.5rem}
audio,textarea{width:100%;max-width:100%;margin:.25rem 0 .75rem}
label{display:block;margin:.35rem 0}
button{font:inherit;padding:.6rem 1rem}
</style>
</head>
<body>
<main>
<h1>Piloto de escucha</h1>
<p>Escucha A y B a un volumen cómodo. Para cada par, indica qué opción te da un punto de partida más útil para continuar una escena. Puedes omitir cualquier par.</p>
<form id="pilot">
<div id="pairs"></div>
<label><input type="checkbox" required> Confirmo que he recibido la información del estudio y consiento participar.</label>
<button type="submit">Guardar respuestas</button>
</form>
<p id="feedback" role="status"></p>
</main>
<script src="pairs.js"></script>
<script>
const form=document.getElementById("pilot");
const host=document.getElementById("pairs");
const guide=document.getElementById("feedback");
const pairs=window.CINEMATICO_PILOT.pairs.slice();
const random=new Uint32Array(pairs.length+2);
crypto.getRandomValues(random);
const participant=random[0].toString(16).padStart(8,"0");
const group=random[1]%2;
for(let i=pairs.length-1;i>0;i--){
 const j=random[i+2]%(i+1);
 [pairs[i],pairs[j]]=[pairs[j],pairs[i]];
}
for(const [index,pair] of pairs.entries()){
 const field=document.createElement("fieldset");
 field.innerHTML='<legend>Par '+(index+1)+'</legend><p>A</p><audio controls preload="none" aria-label="Opción A"></audio>'+
  '<p>B</p><audio controls preload="none" aria-label="Opción B"></audio>'+
  '<label>¿Qué opción usarías? <select name="'+pair.id+'" required><option value="">Elige una opción</option>'+
  '<option>A</option><option>B</option><option>Ambas por igual</option><option>Ninguna</option><option>Omitir</option></select></label>'+
  '<label>Motivo musical (opcional) <textarea name="'+pair.id+'-motivo" rows="2" maxlength="300"></textarea></label>';
 const audio=field.querySelectorAll("audio");
 audio[0].src=pair.tracks[group];
 audio[1].src=pair.tracks[1-group];
 for(const player of audio)player.addEventListener("play",()=>{
  for(const other of host.querySelectorAll("audio"))if(other!==player)other.pause();
 });
 host.append(field);
}
form.addEventListener("submit",event=>{
 event.preventDefault();
 const data=new FormData(form);
 const rows=[["participante_codigo","par","posicion","grupo","eleccion","motivo"]];
 for(const [index,pair] of pairs.entries()){
  rows.push([participant,pair.id,index+1,group,data.get(pair.id),data.get(pair.id+"-motivo")]);
 }
 const escape=value=>{
  const text=String(value);
  return '"'+(/^[=+\-@\t\r]/.test(text)?"'"+text:text).replaceAll('"','""')+'"';
 };
 const blob=new Blob([rows.map(row=>row.map(escape).join(",")).join("\r\n")+"\r\n"],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const download=document.createElement("a");
 download.href=url;
 download.download="cinematico-respuestas-"+participant+".csv";
 download.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 guide.textContent="Guardaste un CSV local. Entrégalo a la persona que coordina la sesión. Evita incluir nombres o datos personales.";
});
</script>
</body>
</html>
