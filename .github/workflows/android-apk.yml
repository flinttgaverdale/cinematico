name: Build standalone Android beta
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'engine.js'
      - 'studio.css'
      - 'assets/fonts/**'
      - 'manifest.json'
      - 'icon-*.png'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
concurrency:
  group: cinematico-android-beta
  cancel-in-progress: false
jobs:
  build-apk:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    environment: ${{ github.event_name == 'workflow_dispatch' && 'android-beta-release' || 'android-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "SDK root: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle the current offline website
        run: |
          bundle=android/app/src/main/assets
          mkdir -p "$bundle/assets"
          cp index.html engine.js studio.css manifest.json icon-192.png icon-512.png "$bundle/"
          cp -R assets/fonts "$bundle/assets/"
      - name: Build PR validation APK
        if: github.event_name == 'pull_request'
        run: gradle --project-dir android :app:assembleDebug --no-daemon
      - name: Build signed beta candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing release keystore}"
          : "${ANDROID_STORE_PASSWORD:?Missing keystore password}"
          : "${ANDROID_KEY_PASSWORD:?Missing key password}"
          : "${ANDROID_KEY_ALIAS:?Missing release key alias}"
          : "${ANDROID_CERT_SHA256:?Missing expected certificate SHA-256}"
          version_code=$((GITHUB_RUN_NUMBER + 3))
          version_name="0.2.0-beta.$version_code"
          gradle --project-dir android :app:assembleRelease --no-daemon \
            -PcinematicoBeta02=true "-PcinematicoVersionCode=$version_code" "-PcinematicoVersionName=$version_name"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$staging/release.jks"
          mkdir -p android-candidate
          apk="android-candidate/Cinematico-Android-$version_name.apk"
          "$build_tools/zipalign" -f -P 16 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$staging/aligned.apk"
          "$build_tools/apksigner" sign --ks "$staging/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false --out "$apk" "$staging/aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$staging/signature.txt"
          fingerprint=$(awk -F ': ' '/^Signer #1 certificate SHA-256 digest:/ {print $2}' "$staging/signature.txt")
          expected=$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$fingerprint" = "$expected"
          "$build_tools/aapt" dump badging "$apk" > "$staging/package.txt"
          grep -F "versionCode='$version_code' versionName='$version_name'" "$staging/package.txt"
          printf 'APK_PATH=%s\n' "$apk" >> "$GITHUB_ENV"
          printf '{"commit":"%s","versionCode":%s,"versionName":"%s","certificateSha256":"%s"}\n' \
            "$GITHUB_SHA" "$version_code" "$version_name" "$fingerprint" > android-candidate/build-info.json
          (cd android-candidate && sha256sum ./*.apk > SHA256SUMS)
      - name: Verify APK and exact website assets
        env:
          DEBUG_APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          path = os.environ.get('APK_PATH', os.environ['DEBUG_APK'])
          files = [Path(name) for name in (
              'index.html', 'engine.js', 'studio.css', 'manifest.json', 'icon-192.png', 'icon-512.png',
          )]
          files.extend(Path('assets/fonts').iterdir())
          with ZipFile(path) as apk:
              assert apk.testzip() is None
              assert 'classes.dex' in apk.namelist()
              for file in files:
                  assert apk.read('assets/' + file.as_posix()) == file.read_bytes(), file
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Cinematico-Android-candidate
          path: android-candidate/
          if-no-files-found: error
