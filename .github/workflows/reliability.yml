name: Cinematico reliability checks
on:
  push:
    branches: [main, feature/simple-create-trial, research/musicology-audit-2026-11, research/musicology-precision-2026-11-08, research/composer-profiles-2026-11-08, feature/composer-harmonic-continuity-2026-11-08, research/composer-context-simulations-2026-11-08, feature/composer-listening-and-cadence-2026-11-08, fix/style-aware-voicing-with-ab-preview-2026-11-08]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test harmonic engine
        run: |
          node tests/phase1-regression.cjs
          node tests/cadence-regression.cjs
          node tests/musicology-regression.cjs
          node tests/musicology-precision.cjs
          node tests/extended-chord-input-validation.cjs
          node tests/deep-musicology-validation.cjs
          node tests/extended-harmonic-functions.cjs
          node tests/composer-research-regression.cjs
          node tests/composer-lenses-integration.cjs
          node tests/composer-continuity-regression.cjs
          node tests/composer-context-simulations.cjs --json
          node tests/composer-voicing-research.cjs
          node tests/composer-listening-regression.cjs
          node tests/contextual-voice-resolution.cjs
          node tests/independent-bass-suspension-slide.cjs
          node tests/score-grounded-regression.cjs
          node tests/score-microanalysis-phase1.cjs
          node tests/harmonic-context-composer-comparison.cjs
          node tests/continuation-diversity.cjs
          node tests/continuation-meaningful-diversity.cjs
          node tests/emotion-evidence-regression.cjs
          node tests/emotion-neighborhoods.cjs
          node tests/expressive-listening-protocol.cjs
          node tests/musician-journey-regression.cjs
          node tests/static-audit.cjs
          node tests/pwa-assets.cjs
          node tests/live-generator-regression.cjs
      - name: Install browser runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/cinematico-server.log 2>&1 &
          sleep 2
      - name: Test browser on desktop and mobile
        run: node tests/browser-smoke.cjs
